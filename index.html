<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fdf7f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小菜谱">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>小菜谱 · 我们的厨房</title>
<style>
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:
  radial-gradient(900px 500px at 10% -10%,#fff2e6,rgba(255,242,230,0) 60%),#fdf7f1;
  color:#3a2f28;font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}
.box{text-align:center;padding:28px 22px;max-width:420px}
.spin{width:34px;height:34px;margin:0 auto 18px;border-radius:50%;
  border:3px solid #f4ded1;border-top-color:#d9714f;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
h1{font-size:20px;margin:0 0 8px;letter-spacing:2px;font-family:"Songti SC","Noto Serif SC",serif}
p{font-size:13px;color:#8b7f76;margin:6px 0;line-height:1.9}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="spin"></div>
  <h1>小菜谱</h1>
  <p>正在打开你的菜谱…</p>
</div>
<script>
(function () {
  var PARTS = ['app.b64.1', 'app.b64.2', 'app.b64.3', 'app.b64.4', 'app.b64.5', 'app.b64.6'];
  var SHA = '50acea7ea387d5564191e7827b48847df44356f510b38d6d572c72d7f0f32f60';
  var box = document.getElementById('box');

  function fail(msg) {
    box.innerHTML = '<h1>没能打开菜谱</h1>' +
      '<p>' + msg + '</p>' +
      '<p>换最新版的 Chrome / Edge / Safari 再试一次。</p>';
  }

  if (!('DecompressionStream' in window) || !window.crypto || !crypto.subtle) {
    fail('这个浏览器版本太旧，不支持解压页面数据。');
    return;
  }

  Promise.all(PARTS.map(function (p) {
    return fetch(p, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('缺少数据文件 ' + p);
      return r.text();
    });
  })).then(function (txts) {
    var b64 = txts.join('').replace(/\s+/g, '');
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    return new Response(stream).text();
  }).then(function (html) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(html)).then(function (d) {
      var u = new Uint8Array(d), hex = '', i;
      for (i = 0; i < u.length; i++) hex += (u[i] < 16 ? '0' : '') + u[i].toString(16);
      if (hex !== SHA) throw new Error('数据校验没通过');
      document.open();
      document.write(html);
      document.close();
    });
  }).catch(function (e) {
    fail(e && e.message ? e.message : '未知错误');
  });
})();
</script>
</body>
</html>
