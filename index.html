<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf7f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小猪小贝">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>小猪和小贝的厨房</title>
<style>
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:
  radial-gradient(900px 500px at 10% -10%,#fff2e6,rgba(255,242,230,0) 60%),#fdf7f1;
  color:#3a2f28;font-family:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",system-ui,-apple-system,sans-serif}
.box{text-align:center;padding:28px 22px;max-width:420px}
.spin{width:34px;height:34px;margin:0 auto 18px;border-radius:50%;
  border:3px solid #f4ded1;border-top-color:#d9714f;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
h1{font-size:20px;margin:0 0 8px;letter-spacing:2px;font-family:"Songti SC","Noto Serif SC",serif}
p{font-size:13px;color:#8b7f76;margin:6px 0;line-height:1.9}
</style>
</head>
<body>
<div class="box" id="box">
  <div class="spin"></div>
  <h1>小猪和小贝的厨房</h1>
  <p>正在打开你的菜谱…</p>
</div>
<script>
(function () {
  var SRC = ['app.html?v=8', 'https://aka.doubaocdn.com/s/YbMYtUi25d'];
  var SHA = 'a6bd792af4d32d6ba02b36554b7439b8a17c092ed1b94e6ae7c8826eb3209422';
  var box = document.getElementById('box');
  function fail(msg) {
    box.innerHTML = '<h1>没能打开菜谱</h1><p>' + msg + '</p>' +
      '<p>换个网络或换最新版 Chrome / Edge / Safari 再试一次。</p>';
  }
  function grab(i) {
    if (i >= SRC.length) { fail('程序没取到，可能是网络断了，刷新再试。'); return; }
    fetch(SRC[i], { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (html) {
        return crypto.subtle.digest('SHA-256', new TextEncoder().encode(html)).then(function (d) {
          var u = new Uint8Array(d), hex = '', k;
          for (k = 0; k < u.length; k++) hex += (u[k] < 16 ? '0' : '') + u[k].toString(16);
          if (hex !== SHA) throw new Error('数据校验没通过');
          document.open();
          document.write(html);
          document.close();
        });
      })
      .catch(function () { grab(i + 1); });
  }
  if (!window.crypto || !crypto.subtle) { fail('浏览器版本太旧。'); return; }
  grab(0);
})();
</script>
</body>
</html>
